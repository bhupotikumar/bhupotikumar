<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin-ring {
      animation: spin 6s linear infinite;
      transform-origin: 90px 90px;
    }
    .pulse-aura {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: 90px 90px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.03); }
    }
  </style>
  <defs>
    <linearGradient id="pink-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="35%" stop-color="#e040fb"/>
      <stop offset="70%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#6a00f4"/>
    </linearGradient>
    <filter id="pink-purple-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="90" cy="90" r="74"/>
    </clipPath>
  </defs>
  <circle cx="90" cy="90" r="85" fill="none" stroke="url(#pink-purple-grad)" stroke-width="1.5" class="pulse-aura" filter="url(#pink-purple-glow)"/>
  <circle cx="90" cy="90" r="81" fill="none" stroke="url(#pink-purple-grad)" stroke-width="4" stroke-dasharray="130 35 85 35" stroke-linecap="round" class="spin-ring" filter="url(#pink-purple-glow)"/>
  <circle cx="90" cy="90" r="74" fill="#161b22"/>
  <image href="data:image/png;base64,PASTE_YOUR_BASE64_IMAGE_HERE" x="16" y="16" width="148" height="148" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle-clip)"/>
</svg>
